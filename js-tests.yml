name: JS Tests

on:
  workflow_run:
    workflows: ["docker-build"]
    types:
      - completed

jobs:
  discover:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
      has_modules: ${{ steps.find.outputs.has_modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover JS-testable modules
        id: find
        run: |
          modules="[]"
          for dir in */; do
            dir="${dir%/}"
            if [ -f "${dir}/module.json" ] && [ -f "${dir}/package.json" ] && [ ! -d "${dir}/react-app" ]; then
              if node -e "const p=require('./${dir}/package.json'); process.exit(p.scripts && p.scripts['test:js:coverage'] ? 0 : 1)" 2>/dev/null; then
                modules=$(echo "$modules" | node -e "
                  let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                    const a=JSON.parse(d);a.push('${dir}');console.log(JSON.stringify(a));
                  });"
                )
              fi
            fi
          done
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ "$modules" = "[]" ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "No JS-testable modules found. Skipping."
          else
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: discover
    if: needs.discover.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run JS tests with coverage
        run: npm run test:js:coverage
        working-directory: ${{ matrix.module }}
